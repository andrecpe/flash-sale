# Perfil "test" (testes unitários com contexto Spring): sem Redis/RabbitMQ/PostgreSQL reais.
# - banco H2 em memória no modo PostgreSQL (o Flyway aplica as mesmas migrations);
# - listeners do RabbitMQ não iniciam; indicadores redis/rabbit desligados;
# - validação de membros do grupo de readiness relaxada.
# A readiness real é verificada no Docker e nos testes de integração (Etapa 9).
spring:
  datasource:
    url: jdbc:h2:mem:checkout_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  rabbitmq:
    listener:
      simple:
        auto-startup: false

estoque:
  inicial: ""

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
  endpoint:
    health:
      validate-group-membership: false

