# Carrega exchange, filas, DLQs e o usuário da aplicação na subida do broker.
# Observação: com definições carregadas no boot, RABBITMQ_DEFAULT_USER é ignorado;
# por isso o usuário "flashsale" está declarado em definitions.json.
load_definitions = /etc/rabbitmq/definitions.json

# Ambiente de desenvolvimento: limite de memória proporcional ao container
vm_memory_high_watermark.relative = 0.6

